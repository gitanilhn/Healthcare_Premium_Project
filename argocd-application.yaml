apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthcare-premium-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/gitanilhn/Healthcare_Premium_Project.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: healthcare-premium

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true